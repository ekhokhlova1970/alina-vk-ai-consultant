[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alina-vk-ai-consultant"
version = "1.0.0"
description = "AI-консультант сообщества ВКонтакте: RAG по локальной базе знаний и ProxyAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elena Khokhlova", email = "ekhokhlova1970@gmail.com" },
]
keywords = ["vk", "chatbot", "openai", "proxyapi", "rag", "llm", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "vk_api>=11.9.9",
    "openai>=1.45.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
alina-bot = "alina_bot.app:main"

[project.urls]
Homepage = "https://github.com/ekhokhlova1970/alina-vk-ai-consultant"
Issues = "https://github.com/ekhokhlova1970/alina-vk-ai-consultant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
